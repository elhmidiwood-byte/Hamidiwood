<style>
:root{--bg:#f3f4f6;--cd:#fff;--tx:#111827;--mu:#6b7280;--nv:#0f1b33;--gd:#c9a227;--bd:#e5e7eb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b1220;--cd:#131d33;--tx:#e8ebf2;--mu:#9aa4b8;--bd:#25314d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b1220;--cd:#131d33;--tx:#e8ebf2;--mu:#9aa4b8;--bd:#25314d;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.5 Tahoma,"Segoe UI",system-ui,sans-serif}
header{background:var(--nv);color:#fff;padding:10px 14px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5}
header img{height:46px;background:#fff;border-radius:8px;padding:3px}header b{color:var(--gd);font-size:15px}header small{display:block;color:#cbd2e0;font-size:11px}
nav{display:flex;gap:6px;overflow-x:auto;background:var(--nv);padding:0 10px 8px;position:sticky;top:64px;z-index:4}
nav button{flex:1;min-width:84px;background:#1b2a4a;color:#dfe5f2;border:0;border-radius:8px;padding:9px 6px;font:inherit;cursor:pointer}nav button.on{background:var(--gd);color:#111;font-weight:700}
main{max-width:1100px;margin:auto;padding:12px}
.cd{background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
h3{margin:0 0 8px;font-size:16px;color:var(--gd)}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px}
label{font-size:12px;color:var(--mu);display:flex;flex-direction:column;gap:3px}
input,select,button.b{font:inherit;padding:8px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);width:100%}
button.b{width:auto;background:var(--nv);color:#fff;cursor:pointer;border:0}button.b.g2{background:var(--gd);color:#111;font-weight:700}button.b.r{background:#9b2c2c}
.row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:8px}
.chip{padding:6px 10px;border-radius:99px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);cursor:pointer;font:inherit}.chip.on{background:var(--gd);color:#111;border-color:var(--gd)}
.w{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}th{color:var(--mu);font-weight:600}
.two{display:grid;grid-template-columns:1fr;gap:12px}@media(min-width:800px){.two{grid-template-columns:1fr 1fr}}
.k{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed var(--bd)}.k.t{font-weight:700;font-size:17px;color:var(--gd)}
.ok{color:#15803d}.er{color:#b91c1c}.mu{color:var(--mu);font-size:12px}svg{max-width:100%;height:auto;display:block}
@media print{header,nav,.np{display:none!important}body{background:#fff;color:#000}.cd{border-color:#999}}

:root{--bg:#f6f0e1;--cd:#fffdf8;--bd:#e6d8b4;--mu:#7a6a45;--gd:#c9a227}
header{background:linear-gradient(135deg,#0a1226,#17284d);border-bottom:3px solid var(--gd)}header b{font-size:18px;letter-spacing:2px}
nav{background:#0f1b33;border-bottom:1px solid #2a3b60}
.cd{box-shadow:0 2px 12px rgba(15,27,51,.09);border-top:3px solid var(--gd)}
h3::before{content:"";display:inline-block;width:6px;height:16px;background:var(--gd);margin-inline-end:8px;border-radius:2px;vertical-align:-2px}
button.b.g2,nav button.on{background:linear-gradient(135deg,#ecd06a,#b8921f)}
input:focus,select:focus{outline:2px solid var(--gd)}th{background:rgba(201,162,39,.12)}
.drw{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-bottom:10px}.drw>div{flex:1 1 200px;max-width:340px;text-align:center;font-size:13px;color:var(--mu)}

:root:root:root{--bg:#e8d8b9;--cd:#fffdf9;--tx:#16120c;--mu:#6b5733;--nv:#0d0d0d;--gd:#b8902f;--bd:#e0cfa6;color-scheme:light}
body{background:#e8d8b9 repeating-linear-gradient(92deg,rgba(110,72,28,.07) 0 1px,transparent 1px 7px),repeating-linear-gradient(88deg,rgba(255,255,255,.18) 0 3px,transparent 3px 19px),linear-gradient(180deg,#eadcc0,#dcc7a0);background-attachment:fixed;min-height:100vh}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#050505;z-index:30}
header{top:env(safe-area-inset-top,0px);padding:10px 16px;gap:14px;z-index:20;background:linear-gradient(135deg,#050505,#1c1710);border-bottom:2px solid #d4af37;box-shadow:0 4px 18px rgba(0,0,0,.35)}
header img.logo{height:56px;width:auto;background:none;border-radius:0;padding:0;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.55))}
.brand{display:flex;flex-direction:column;gap:3px;min-width:0;flex:1}
.brand .nm{display:flex;align-items:center;flex-wrap:wrap;column-gap:10px}
.brand .nm b{font-size:clamp(18px,5.2vw,25px);font-weight:700;line-height:1.35;letter-spacing:0;background:linear-gradient(90deg,#f3dc8a,#d4af37 55%,#f3dc8a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .nm i{font-style:normal;font-size:clamp(12px,3.5vw,15px);color:#f1e6c0;font-weight:500;padding-inline-start:10px;border-inline-start:1px solid rgba(212,175,55,.6)}
.brand small{display:block;margin:0;font-size:clamp(11px,3.1vw,13.5px);color:#d9c690;letter-spacing:0;font-weight:400;line-height:1.4}
.fbk{flex:none;width:42px;height:42px;border-radius:50%;display:grid;place-items:center;border:1px solid #d4af37;color:#f3dc8a;background:rgba(212,175,55,.08);transition:background .2s,color .2s}
.fbk:hover,.fbk:focus-visible{background:linear-gradient(135deg,#f3dc8a,#b8902f);color:#111;outline:none}
.fbk svg{width:22px;height:22px;fill:currentColor}
nav{top:calc(var(--hh,76px) + env(safe-area-inset-top,0px));z-index:15}
nav button{font-family:'Tajawal','Segoe UI',Tahoma,sans-serif;font-weight:500}nav button.on{font-weight:800}
main{padding-bottom:96px}
.ft{background:linear-gradient(135deg,#050505,#1c1710);color:#d9c690;border-top:2px solid #d4af37;padding:20px 16px 22px;text-align:center;font-size:13px}
.ft img{height:50px;width:auto;display:block;margin:0 auto 8px}
.ft b{display:block;color:#f3dc8a;font-size:18px;font-weight:700}
.ft .lk{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.ft .lk a{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;border:1px solid #d4af37;color:#f3dc8a;text-decoration:none;font-weight:700}
.ft .lk a.w{background:#25d366;border-color:#25d366;color:#052e16}
.ft svg{width:18px;height:18px;fill:currentColor}
.wa{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:25;width:58px;height:58px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;box-shadow:0 8px 22px rgba(0,0,0,.35),0 0 0 3px rgba(255,255,255,.92);transition:transform .2s;text-decoration:none}
.wa:hover{transform:scale(1.07)}.wa svg{width:31px;height:31px;fill:currentColor}
@media(prefers-reduced-motion:no-preference){.wa::after{content:"";position:absolute;inset:0;border-radius:50%;border:2px solid #25d366;animation:wp 2.6s infinite;pointer-events:none}}
@keyframes wp{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.65);opacity:0}}
.qh{display:flex;align-items:center;gap:14px;padding-bottom:10px;margin-bottom:12px;border-bottom:2px solid #b8902f}
.qh img{height:66px;width:auto;flex:none}.qh b{display:block;font-size:20px;color:#8a6a16}.qh .tg{color:#5c4713;font-size:14px}
.wb{border-top-color:#b91c1c!important}.wb ul{margin:6px 0 0;padding-inline-start:20px}.wb li{margin:2px 0}
@media print{.wa,.ft{display:none!important}.qh img{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
